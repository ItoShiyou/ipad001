name: ScoreStand
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEVELOPMENT_TEAM: ""

targets:
  ScoreStand:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ScoreStand
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ScoreStand
        INFOPLIST_FILE: ScoreStand/Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"      # iPhone + iPad
        SUPPORTS_MAC_CATALYST: NO
        CODE_SIGN_STYLE: Automatic

  ScoreStandTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ScoreStandTests
    dependencies:
      - target: ScoreStand
