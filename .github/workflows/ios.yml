name: iOS build & test

# このリポジトリは public なので、macOS ランナーは無料で使える。
# Mac を持っていなくても「コンパイルが通るか」「単体テストが通るか」はここで確認できる。
# 実機でしか測れないもの（NFR-01 の 16ms、Apple Pencil、フットペダル、暗所）は対象外。

on:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: 環境を表示
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: XcodeGen を入れる
        run: brew install xcodegen

      - name: Xcode プロジェクトを生成
        working-directory: ios
        run: |
          xcodegen generate
          xcodebuild -list -project ScoreStand.xcodeproj

      # ランナーによって用意されているシミュレータが違う。
      # 名前を決め打ちすると壊れるので、利用可能な iPad を実行時に選ぶ。
      - name: シミュレータを選ぶ
        id: sim
        run: |
          xcrun simctl list devices available
          UDID=$(python3 ios/Scripts/pick_simulator.py)
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: ビルド
        working-directory: ios
        run: |
          set +e
          xcodebuild build \
            -project ScoreStand.xcodeproj \
            -scheme ScoreStand \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            > build.log 2>&1
          status=$?
          # 失敗時はログ全文ではなくエラー行だけを出す。
          # 全文はランナーのログ末尾に埋もれて読めないため。
          if [ $status -ne 0 ]; then
            echo "================ COMPILE ERRORS ================"
            grep -E "error:" build.log \
              | sed -E 's|/Users/runner/work/ipad001/ipad001/ios/||' \
              | sort -u | head -120
            echo "================ END ERRORS ===================="
          fi
          exit $status

      - name: テスト
        working-directory: ios
        run: |
          set +e
          xcodebuild test \
            -project ScoreStand.xcodeproj \
            -scheme ScoreStand \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            > test.log 2>&1
          status=$?
          echo "================ TEST RESULTS =================="
          grep -E "Test Case .* (passed|failed)|error:|Executed [0-9]+ test" test.log \
            | sed -E 's|/Users/runner/work/ipad001/ipad001/ios/||' | tail -60
          echo "================ END TESTS ====================="
          exit $status

      - name: 警告を集計
        if: always()
        working-directory: ios
        run: |
          echo "### 警告" >> "$GITHUB_STEP_SUMMARY"
          grep -h "warning:" build.log 2>/dev/null | sed 's|.*/||' | sort | uniq -c | sort -rn | head -40 >> "$GITHUB_STEP_SUMMARY" || echo "なし" >> "$GITHUB_STEP_SUMMARY"

      - name: ログを保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: ios/*.log
          if-no-files-found: ignore
